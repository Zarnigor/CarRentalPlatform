services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    command: gunicorn root.wsgi:application --bind 0.0.0.0:8000 --workers 4
    environment:
      DATABASE_URL: postgres://dev:dev@pgbouncer:6432/car_rental
      REDIS_URL: redis://redis:6379/0
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 4          # `docker compose up --scale api=n` bilan ham override qilinadi

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    command: uv run celery -A root worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgres://dev:dev@pgbouncer:6432/car_rental
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - pgbouncer
      - redis
    deploy:
      replicas: 3

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    command: uv run celery -A root beat --loglevel=info
    environment:
      DATABASE_URL: postgres://dev:dev@pgbouncer:6432/car_rental
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - pgbouncer
      - redis

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://dev:dev@db:5432/car_rental
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
    depends_on:
      - db

  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_DB: car_rental
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: